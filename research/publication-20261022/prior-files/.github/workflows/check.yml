name: Numerical candidate verification
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: sh tools/setup.sh
      - run: .venv/bin/python tools/check.py
      - run: .venv/bin/python tools/contribute.py --order 3 --seed 419 --out research/ci-trial
      - run: .venv/bin/python tools/verify_candidate.py research/ci-trial/candidate.json
